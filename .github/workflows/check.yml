name: Check build

# Builds and verifies the site on every branch and pull request, WITHOUT publishing anything.
# Publishing only happens from main (see deploy.yml).
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (client + server render + pre-render)
        run: npm run build

      - name: Verify generated pages
        run: npm run verify
